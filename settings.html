<div class="sd-power-tools-settings">
    <h4>VN Sprite Settings</h4>

    <label>Sprite Height: <span id="sdpt-height-val">55</span>%</label>
    <input type="range" id="sdpt-height" min="10" max="100" step="1" value="55">

    <label>Sprite Width: <span id="sdpt-width-val">100</span>%</label>
    <input type="range" id="sdpt-width" min="10" max="100" step="1" value="100">

    <label>Vertical Position (object-position Y): <span id="sdpt-objpos-val">top</span></label>
    <input type="range" id="sdpt-objpos" min="0" max="100" step="1" value="0">

    <small style="opacity:0.6">0% = top, 50% = center, 100% = bottom</small>
</div>
